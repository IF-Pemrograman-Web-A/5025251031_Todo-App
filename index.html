<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>My Todo List</h1>
        <p>Atur tugas, atur hidup.</p>
        <button id="theme-toggle" class="btn" style="margin-top: 10px;"> Dark Mode</button>
        <div class="header-line"></div>
    </header>

    <main class="container">

        <section class="todo-panel">
            <h2>My Todos</h2>

            <div id="todo-container"></div>
        </section>
        
        <div class="right-column">
            
            <aside class="detail-panel">
                <h2>Todo Detail</h2>

                <form id="detail-form">
                    <label for="detail-title">Todo Title</label>
                    <input type="text" id="detail-title" readonly placeholder="Klik item todo di kiri untuk melihat/mengedit">

                    <label for="detail-description">Description</label>
                    <textarea id="detail-description" rows="3" readonly></textarea>
                    
                    <label for="detail-deadline">Deadline</label>
                    <input type="text" id="detail-deadline" readonly>

                    <label for="detail-status">Status Progress</label>
                    <select id="detail-status">
                        <option value="not-started">Belum Selesai</option>
                        <option value="progress">On Progress</option>
                        <option value="completed">Selesai</option>
                    </select>

                    <div class="button-group">
                        <button type="button" id="btn-delete-detail" class="btn btn-delete">Hapus</button>
                        <button type="button" id="btn-save-detail" class="btn">Simpan Perubahan</button>
                    </div>
                </form>
            </aside>

            <aside class="create-panel">
                <h2>Create New Todo</h2>

                <form id="create-todo-form">
                    <label for="new-title">Todo Title</label>
                    <input type="text" id="new-title" placeholder="Enter todo title" required>

                    <label for="new-description">Description</label>
                    <textarea id="new-description" rows="3" placeholder="Enter description"></textarea>

                    <label for="new-deadline">Deadline</label>
                    <input type="date" id="new-deadline">

                     <div class="button-group">
                        <button type="submit" class="btn">Add Todo</button>
                    </div>
                </form>
            </aside>

        </div>

    </main>

    <script src="index.js"></script>
</body>
</html>
